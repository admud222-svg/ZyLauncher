# Zy Launcher build: compiles the release APK and signs it with the Zy Launcher key (repository secrets
# ZY_KEYSTORE_B64 / ZY_KEYSTORE_PASS). Pushing a tag v* also publishes a GitHub Release.
name: Build Zy Launcher

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "build-tools;35.0.0"

      - name: Android NDK r28c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        env:
          ZY_KEYSTORE_B64: ${{ secrets.ZY_KEYSTORE_B64 }}
          ZY_KEYSTORE_PASS: ${{ secrets.ZY_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          IN=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "$ZY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zy.jks"
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/zy.jks" --ks-key-alias zylauncher \
            --ks-pass env:ZY_KEYSTORE_PASS --key-pass env:ZY_KEYSTORE_PASS \
            --out ZyLauncher.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs ZyLauncher.apk | head -n 3
          rm -f "$RUNNER_TEMP/zy.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZyLauncher-apk
          path: ZyLauncher.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ZyLauncher.apk
          generate_release_notes: true
